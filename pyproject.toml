[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "underwater-vision"
version = "0.1.0"
description = "Visibility-aware multi-view underwater archaeological reconstruction"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "opencv-python-headless>=4.9,<6", "Pillow>=10", "requests>=2.31", "hydra-core>=1.3,<1.4", "pycolmap==3.13.0", "matplotlib>=3.8", "plyfile>=1.0"]

[project.optional-dependencies]
neural = ["torch>=2.2", "torchvision>=0.17"]
tracking = ["mlflow-skinny>=2.15"]
visualization = ["open3d>=0.18", "plotly>=5"]
dev = ["pytest>=8", "ruff>=0.6", "black>=24", "nbformat>=5", "nbclient>=0.10", "ipykernel>=6", "pandas>=2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
